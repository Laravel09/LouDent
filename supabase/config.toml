# Supabase project configuration for LouDent
project_id = "qlsfeqofszmtdkdedkqz"

[api]
enabled = true
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/confirm",
  "http://127.0.0.1:5173/auth/confirm"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"

# The project uses asymmetric JWT signing keys (ES256, verified against
# /auth/v1/.well-known/jwks.json inside the function). Disable the legacy
# gateway HS256 check so ES256 tokens are verified by jose in index.ts.
[functions.provision-dentist]
verify_jwt = false
